[project]
name = "coach-assistant-ai"
version = "0.1.0"
description = "AI-powered coaching assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "pypdf>=4.0.0",
    "fastembed>=0.8.0",
]

[dependency-groups]
# Optional: ingesting YouTube / local media into knowledge collections.
# youtube-transcript-api fetches captions (yt-dlp caption download is blocked by
# YouTube's PO-token requirement as of 2025). yt-dlp is used for channel
# enumeration and audio download; faster-whisper transcribes captionless media.
media = [
    "youtube-transcript-api>=1.2.0",
    "yt-dlp>=2025.1.1",
    "faster-whisper>=1.0.0",
]
finetune = [
    "torch>=2.1.0",
    "datasets>=2.19.0",
    "transformers>=4.41.0",
    "trl>=0.9.0",
    "peft>=0.11.0",
    "accelerate>=0.30.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Default rule set (E/F) only for now; broaden gradually.
select = ["E", "F"]
# Line-length is not yet enforced across the existing tree (many pre-existing
# lines run long); tighten this once a `ruff format` pass is done separately.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Standalone scripts do `sys.path.insert(0, ROOT)` before importing `app.*`,
# since they run outside the installed package.
"scripts/*.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
# Non-strict starting point — tighten incrementally.
check_untyped_defs = false
disallow_untyped_defs = false
warn_unused_ignores = false
exclude = ["tests/", "scripts/"]

# Pre-existing type errors, silenced so the CI gate can go in without a large
# refactor. Each is a real mismatch worth fixing on its own — see
# docs/archive/PRODUCTION_READINESS_CHECKLIST.md TEST-03 — not an intentional ignore.
[[tool.mypy.overrides]]
module = [
    "app.core.tools",
    "app.rag.retriever",
    "app.core.tool_router",
    "app.api.chat",
    "app.api.openai_compat",
]
ignore_errors = true

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
skip_covered = false
show_missing = true
