[project]
name = "coach-assistant-ai"
version = "0.1.0"
description = "AI-powered coaching assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "pypdf>=4.0.0",
]

[dependency-groups]
rag-rerank = [
    "sentence-transformers>=3.0.0",
]
finetune = [
    "torch>=2.1.0",
    "datasets>=2.19.0",
    "transformers>=4.41.0",
    "trl>=0.9.0",
    "peft>=0.11.0",
    "accelerate>=0.30.0",
]
