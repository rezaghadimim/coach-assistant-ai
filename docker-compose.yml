services:
  # ─────────────────────────────────────────────
  # Coach Assistant AI — FastAPI backend
  # ─────────────────────────────────────────────
  coach-api:
    container_name: coach-assistant-api
    build: .
    ports:
      - "8000:8000"
    # Load operator settings from the project .env (copy from .env.example).
    # Values in `environment` below override the file for Docker-specific paths.
    env_file:
      - .env
    environment:
      # Inside Docker, localhost is the container — use host.docker.internal to
      # reach Ollama on the Mac/Windows host. Override only for a remote Ollama.
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-llama3.1:8b}"
      # OpenRouter (optional cloud provider — leave OPENROUTER_API_KEY empty to disable)
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      OPENROUTER_MODELS: "${OPENROUTER_MODELS:-openai/gpt-4o-mini,openai/gpt-oss-120b:free,openai/gpt-oss-20b:free}"
      OPENROUTER_BASE_URL: "${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}"
      # Pin reranker cache to an absolute path inside the named volume so the
      # model survives container rebuilds and CWD-agnostic restarts.
      # NOTE: never run `docker compose down -v` unless you want a full cache wipe.
      RAG_RERANK_CACHE_DIR: "/app/data/rerank_cache"
      # Logging: set to DEBUG to see every pipeline step (scope, intent, embed, rerank, LLM)
      # Trace a single message: docker compose logs coach-api | grep "msg=<id>"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      # Set to false to suppress message/reply text in step logs (privacy)
      LOG_STEP_PAYLOADS: "${LOG_STEP_PAYLOADS:-true}"
    volumes:
      - coach_data:/app/data
      - ./docs/knowledge:/app/docs/knowledge:ro
      - ./docs/tool-knowledge:/app/docs/tool-knowledge:ro
      - ./static:/app/static:ro
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      # First boot may still index RAG / warm Ollama embeds before /health/live responds.
      start_period: 90s

  # ─────────────────────────────────────────────
  # Open WebUI — Coach Assistant chat front-end
  # ─────────────────────────────────────────────
  open-webui:
    container_name: coach-assistant-webui
    image: ghcr.io/open-webui/open-webui:main
    ports:
      - "3000:8080"
    environment:
      # Coach API handles RAG — skip Open WebUI's HuggingFace embedding download at startup.
      BYPASS_EMBEDDING_AND_RETRIEVAL: "true"
      # Open WebUI still preloads default embedding/rerank/whisper models unless these are off.
      RAG_EMBEDDING_MODEL_AUTO_UPDATE: "false"
      RAG_RERANKING_MODEL_AUTO_UPDATE: "false"
      WHISPER_MODEL_AUTO_UPDATE: "false"
      # Use docker-compose env for connections; ignore stale Admin UI settings in webui.db.
      ENABLE_PERSISTENT_CONFIG: "false"
      # Disable the built-in Ollama connection; use our backend instead.
      ENABLE_OLLAMA_API: "false"
      # Tell Open WebUI where our OpenAI-compatible endpoint lives.
      OPENAI_API_BASE_URL: "http://coach-api:8000/v1"
      OPENAI_API_KEY: "not-needed"
      # Coach branding for the UI
      WEBUI_NAME: "Coach Assistant AI"
      WEBUI_LOGO_URL: "http://localhost:8000/static/logo.svg"
      WEBUI_FAVICON_URL: "http://localhost:8000/static/logo.svg"
      DEFAULT_MODELS: "coach-assistant-ai"
      # Forward logged-in user id/name to the Coach API on each chat request.
      ENABLE_FORWARD_USER_INFO_HEADERS: "true"
    volumes:
      - webui_data:/app/backend/data
    depends_on:
      coach-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  coach_data:
    name: coach-assistant-data
  webui_data:
    name: coach-assistant-webui-data
