name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Check cross-file contracts
        run: python scripts/check_contracts.py

      - name: Check doc paths
        run: python scripts/check_doc_paths.py

      - name: Type check (mypy)
        run: mypy app/

      - name: Run tests with coverage
        # conftest.py applies the full Test Execution Contract (docs/TEST_EXECUTION.md)
        # before app import — temp DB, env pins, network guard. These three env vars
        # are redundant with conftest but kept visible as the historical CI-safe trio.
        env:
          RAG_BACKEND: token
          TOOL_ROUTER_BACKEND: token
          RESPONSE_FORMATTER_ENABLED: "false"
        run: |
          coverage run -m pytest tests/ -v
          coverage report --fail-under=75
