name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Check cross-file contracts
        run: python scripts/check_contracts.py

      - name: Type check (mypy)
        run: mypy app/

      - name: Run tests with coverage
        # conftest.py's debug-mode setup is a pytest fixture convention — it is
        # never loaded by `unittest discover`, so pytest (which understands
        # unittest.TestCase tests natively) is the correct runner here.
        # Env pins match the CI-safe invocation in docs/OPERATIONS.md: token
        # backends avoid auto-probe nondeterminism (no Ollama in CI) and the
        # disabled formatter avoids reranker model downloads.
        env:
          RAG_BACKEND: token
          TOOL_ROUTER_BACKEND: token
          RESPONSE_FORMATTER_ENABLED: "false"
        run: |
          coverage run -m pytest tests/ -v
          coverage report --fail-under=75
